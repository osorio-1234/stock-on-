<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Inicio de sesión y registro de usuarios de Stock On."
    >

    <title>Stock On | Cuenta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-box">

            <a href="index.html" class="login-logo">
                Stock <span>On</span>
            </a>


            <div id="loginSection">

                <p class="login-text">
                    Inicia sesión para entrar a Stock On.
                </p>

                <form id="loginForm">

                    <label for="loginUsuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="loginUsuario"
                        placeholder="Tu usuario"
                        autocomplete="username"
                        required
                    >


                    <label for="loginPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >


                    <button type="submit" class="btn">
                        Iniciar sesión
                    </button>

                    <p id="loginError" class="form-error"></p>

                </form>


                <div class="login-change">

                    <p>
                        ¿Todavía no tienes una cuenta?
                    </p>

                    <button
                        id="mostrarRegistro"
                        class="link-btn"
                        type="button"
                    >
                        Crear una cuenta
                    </button>

                </div>

            </div>


            <div id="registerSection" class="oculto">

                <p class="login-text">
                    Crea tu cuenta para comenzar a utilizar Stock On.
                </p>

                <form id="registerForm">

                    <label for="registroUsuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="registroUsuario"
                        placeholder="Crea tu usuario"
                        autocomplete="username"
                        minlength="3"
                        maxlength="50"
                        required
                    >


                    <label for="registroPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="registroPassword"
                        placeholder="Crea tu contraseña"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >


                    <label for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarPassword"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                        required
                    >


                    <button type="submit" class="btn">
                        Crear cuenta
                    </button>

                    <p id="registroError" class="form-error"></p>

                </form>


                <div class="login-change">

                    <p>
                        ¿Ya tienes una cuenta?
                    </p>

                    <button
                        id="mostrarLogin"
                        class="link-btn"
                        type="button"
                    >
                        Iniciar sesión
                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
