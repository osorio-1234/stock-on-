<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Stock On | Administración</title><link rel="stylesheet" href="../style.css"><style>
.admin-wrap{max-width:1100px;margin:3rem auto;padding:0 1.2rem}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin:1.5rem 0}.admin-stat,.admin-panel{background:var(--surface,#fff);border:1px solid var(--border,#ddd);border-radius:16px;padding:1.2rem}.admin-stat strong{font-size:2rem;display:block}.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.admin-form textarea{grid-column:1/-1;min-height:90px}.admin-form button{justify-self:start}.admin-list{display:grid;gap:.7rem;margin-top:1rem}.admin-row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem;border-bottom:1px solid var(--border,#ddd);flex-wrap:wrap}.admin-row small{display:block}.admin-actions{display:flex;gap:.5rem}.admin-actions button{padding:.5rem .8rem}@media(max-width:600px){.admin-form{grid-template-columns:1fr}}
</style></head><body><div id="layout-header"></div><main class="admin-wrap"><div class="admin-top"><div><p class="small-title">Panel privado</p><h1>Administración de Stock On</h1><p>Gestiona el catálogo y revisa los mensajes recibidos.</p></div><button class="btn" id="salirAdmin">Cerrar sesión</button></div><p id="adminEstado" role="status"></p><section class="admin-grid"><article class="admin-stat"><span>Productos</span><strong id="totalProductos">—</strong></article><article class="admin-stat"><span>Usuarios</span><strong id="totalUsuarios">—</strong></article><article class="admin-stat"><span>Mensajes pendientes</span><strong id="totalMensajes">—</strong></article></section><section class="admin-panel"><h2 id="formTitulo">Agregar producto</h2><form id="productoForm" class="admin-form"><input id="productoNombre" placeholder="Nombre" required maxlength="100"><input id="productoCategoria" placeholder="Categoría" required maxlength="80"><input id="productoPais" placeholder="País" required maxlength="80"><textarea id="productoDescripcion" placeholder="Descripción" required maxlength="600"></textarea><label><input id="productoDisponible" type="checkbox" checked> Disponible</label><button class="btn" type="submit">Guardar producto</button><button class="btn" type="button" id="cancelarEdicion" hidden>Cancelar edición</button></form><div id="productosAdmin" class="admin-list"></div></section><section class="admin-panel" style="margin-top:1.2rem"><h2>Mensajes de contacto</h2><div id="mensajesAdmin" class="admin-list"></div></section></main><script src="../js/api.js"></script><script src="../js/layout.js"></script><script src="admin.js"></script></body></html>
